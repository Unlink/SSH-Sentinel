# Run directly with: docker compose up -d --build
# Every setting below has a default; .env is optional.
name: ssh-sentinel
services:
  sensor:
    image: ssh-sentinel-sensor:local
    build:
      context: .
      dockerfile: docker/Dockerfile.sensor
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.50
    pids_limit: 64
    ports:
      - "${SSH_BIND:-127.0.0.1}:${SSH_PORT:-2222}:2222"
    environment:
      SENTINEL_LOG_PASSWORDS: "${LOG_PASSWORDS:-true}"
      SENTINEL_RETENTION_DAYS: "${RETENTION_DAYS:-30}"
      SENTINEL_MAX_CONNECTIONS: "${MAX_CONNECTIONS:-64}"
      SENTINEL_SESSION_SECONDS: "${SESSION_SECONDS:-300}"
      SENTINEL_MAX_COMMANDS: "${MAX_COMMANDS:-200}"
      SENTINEL_SPOOL_BYTES: "${SPOOL_BYTES:-268435456}"
    volumes:
      - events:/events
      - sensor-keys:/keys
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    networks: [sensor-net]
    dns: [127.0.0.1]
    healthcheck:
      test: [CMD, python, -c, "import json,time; from pathlib import Path; s=json.loads(Path('/keys/health.json').read_text()); assert s['healthy'] and time.time()-s['time']<40"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  web:
    image: ssh-sentinel-web:local
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 64
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    environment:
      SENTINEL_RETENTION_DAYS: "${RETENTION_DAYS:-30}"
      SENTINEL_COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SENTINEL_ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      SENTINEL_MAX_DB_EVENTS: "${MAX_DB_EVENTS:-100000}"
      SENTINEL_MAX_EVENT_STORAGE_BYTES: "${MAX_EVENT_STORAGE_BYTES:-67108864}"
      SENTINEL_MAX_DB_BYTES: "${MAX_DB_BYTES:-268435456}"
      SENTINEL_MAX_SPOOL_FILES: "${MAX_SPOOL_FILES:-4096}"
    volumes:
      - events:/events:ro
      - dashboard-data:/data
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    networks: [web-net]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
volumes:
  events:
  sensor-keys:
  dashboard-data:
networks:
  sensor-net:
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${SENSOR_SUBNET:-172.30.222.0/24}
  web-net:
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${WEB_SUBNET:-172.30.223.0/24}
